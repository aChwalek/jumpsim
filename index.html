<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>jumpsim</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      canvas#view { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
      #hud {
        position: fixed; inset: 0; pointer-events: none; user-select: none;
        font: 500 14px/1.3 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #fff; text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75);
        font-variant-numeric: tabular-nums;
      }
      #hud.hidden .flight { display: none; }
      #hud.menu > * { display: none; }
      .corner { position: absolute; padding: 14px 18px; }
      #perf { top: 0; left: 0; font-size: 12px; opacity: 0.8; }
      #topRight { top: 0; right: 0; text-align: right; }
      #gear { font-size: 12px; opacity: 0.8; margin-top: 2px; }
      .gauge { position: absolute; bottom: 26px; text-align: center; min-width: 150px; }
      .gauge .value { font-size: 44px; font-weight: 650; line-height: 1; }
      .gauge .unit { font-size: 16px; opacity: 0.85; margin-left: 4px; }
      .gauge .label { font-size: 11px; letter-spacing: 0.12em; opacity: 0.75; margin-top: 4px; }
      #altimeter { position: absolute; left: 22px; bottom: 22px; }
      #altimeter .dial { width: 132px; height: 132px; display: block; filter: drop-shadow(0 2px 6px rgba(0, 0, 0, 0.5)); }
      #altimeter .digital {
        background: #1b1e23; border: 3px solid #3a3e46; border-radius: 10px; padding: 6px 12px 4px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.5); text-shadow: none; min-width: 110px; text-align: right;
      }
      #altimeter .digits { font: 600 40px/1 ui-monospace, 'SF Mono', Menlo, monospace; color: #c8f0d0; letter-spacing: 0.02em; }
      #altimeter .unit { font-size: 15px; color: #8fb59a; margin-left: 4px; }
      #speeds { right: 26px; text-align: right; }
      #speeds .value { font-size: 30px; }
      #speeds .row + .row { margin-top: 8px; }
      #brakes { position: absolute; left: 50%; bottom: 22px; transform: translateX(-50%); display: flex; gap: 86px; }
      .bar { width: 12px; height: 110px; border: 1px solid rgba(255, 255, 255, 0.7); border-radius: 3px; position: relative; background: rgba(0, 0, 0, 0.25); }
      .bar .fill { position: absolute; top: 0; left: 0; right: 0; background: #ffd84a; border-radius: 2px; }
      .bar .fill.wraps { background: #ff5a4a; }
      .bar .front { position: absolute; top: -9px; left: -4px; right: -4px; height: 5px; background: #6fd0ff; border-radius: 2px; opacity: 0; }
      #held { position: absolute; left: 50%; bottom: 144px; transform: translateX(-50%); font-size: 11px; letter-spacing: 0.12em; opacity: 0; }
      #cue { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); text-align: center; font-size: 13px; letter-spacing: 0.12em; }
      #guide { position: absolute; left: 50%; top: 112px; transform: translateX(-50%); display: flex; gap: 10px; font-size: 15px; font-weight: 600; letter-spacing: 0.08em; white-space: nowrap; }
      #guide span { padding: 4px 10px; border-radius: 6px; background: rgba(10, 16, 24, 0.55); }
      #guide .ok { opacity: 0.55; font-weight: 400; }
      #guide i { margin-left: 6px; font-style: normal; }
      #guide svg.pad { display: inline-block; vertical-align: middle; }
      #guide kbd { margin-left: 6px; padding: 0 5px; border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 4px; font: inherit; font-size: 12px; }
      #cue small { display: block; margin-top: 3px; font-size: 11px; letter-spacing: 0.04em; opacity: 0.8; }
      #hud.freefall #brakes, #hud.freefall #held { display: none; }
      #keys {
        position: absolute; left: 18px; top: 50%; transform: translateY(-50%);
        display: grid; grid-template-columns: auto auto; gap: 4px 9px; align-items: center;
        font-size: 11.5px; opacity: 0.8; padding: 8px 11px; border-radius: 8px; background: rgba(10, 14, 20, 0.28);
      }
      #keys.off, #keys:empty { display: none; }
      #keys kbd {
        display: inline-block; min-width: 9px; padding: 0 4px; margin-right: 2px; text-align: center;
        font: 600 10.5px/15px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        border: 1px solid rgba(255, 255, 255, 0.5); border-radius: 3px; background: rgba(0, 0, 0, 0.18);
      }
      #keys .foot { grid-column: 1 / -1; margin-top: 5px; font-size: 10.5px; opacity: 0.75; }
      #keys.gamepad { gap: 6px 11px; font-size: 13px; opacity: 0.85; }
      #keys svg.pad { display: inline-block; vertical-align: middle; margin-right: 4px; filter: drop-shadow(0 1px 2px rgba(0, 0, 0, 0.6)); }
      /* A touch screen: the corners are for the thumbs, the instruments gather at the foot of the middle. */
      #hud.touch #perf { left: calc(108px + env(safe-area-inset-left, 0px)); }
      #hud.touch #altimeter { left: auto; right: calc(50% + 72px); bottom: 12px; transform: scale(0.8); transform-origin: bottom right; }
      #hud.touch #speeds { right: auto; left: calc(50% + 72px); bottom: 12px; min-width: 0; text-align: left; }
      #hud.touch #speeds .value { font-size: 24px; }
      #hud.touch #speeds .unit { font-size: 13px; }
      #hud.touch #speeds .row + .row { margin-top: 4px; }
      #hud.touch #brakes { bottom: 12px; }
      #altimeter.warn .digits { color: #ffd84a; }
      #altimeter.danger .digits { color: #ff5a4a; }
      .card {
        position: absolute; left: 50%; top: 42%; transform: translate(-50%, -50%);
        background: rgba(12, 16, 22, 0.72); border-radius: 12px; padding: 22px 30px; text-align: center;
        text-shadow: none; backdrop-filter: blur(6px); display: none; max-width: 520px;
      }
      .card h1 { margin: 0 0 8px; font-size: 26px; font-weight: 650; }
      .card p { margin: 6px 0; opacity: 0.9; }
      .card table { margin: 10px auto 4px; border-collapse: collapse; text-align: left; }
      .card td { padding: 3px 10px; }
      .card td:first-child { font-weight: 650; white-space: nowrap; }
      .card .hint { margin-top: 12px; font-size: 12px; opacity: 0.7; }
      .card .actions { display: flex; gap: 10px; justify-content: center; margin-top: 16px; pointer-events: auto; }
      .card button {
        font: 600 14px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; cursor: pointer;
        padding: 10px 18px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.08);
      }
      .card button:hover { background: rgba(255, 255, 255, 0.2); }
      .card button.focus { box-shadow: 0 0 0 2px #14181e, 0 0 0 4px #ffd84a; }
      .card button[data-act='retry'] { background: #ffd84a; color: #14181e; border-color: #ffd84a; }
      .card.noReplay .replayBtn, .card.noWatch .watchBtn { display: none; }
      /* Walking about: out of the way at the bottom, the verdict and the buttons only. */
      .card.compact { top: auto; bottom: 18px; transform: translateX(-50%); padding: 12px 18px; }
      .card.compact h1 { font-size: 18px; margin: 0; }
      .card.compact p, .card.compact table { display: none; }
      .card.compact .actions { margin-top: 10px; }
      #replay { position: absolute; left: 26px; top: 22px; display: none; font: 700 22px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; }
      #replay::before { content: ''; display: inline-block; width: 13px; height: 13px; margin-right: 9px; border-radius: 50%; background: #ff3b30; animation: rec 1s steps(2) infinite; }
      #replay small { display: block; margin: 6px 0 0 22px; font: 500 11px/1 -apple-system, sans-serif; letter-spacing: 0.04em; opacity: 0.75; }
      @keyframes rec { 50% { opacity: 0; } }
      #hud.replaying #replay { display: block; }
      #hud.replaying .flight, #hud.replaying .card { visibility: hidden; }
      /* A whole jump watched again: its instruments, and the bar to move about in it. */
      #watch {
        position: absolute; left: 50%; top: 14px; transform: translateX(-50%); width: min(560px, calc(100vw - 32px)); display: none;
        padding: 10px 14px 9px; border-radius: 10px; background: rgba(12, 16, 22, 0.55); backdrop-filter: blur(6px);
        pointer-events: auto; text-shadow: none;
      }
      #watch .head { display: flex; align-items: baseline; gap: 10px; }
      #watch .head b { font: 700 18px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.14em; }
      #watch .head b::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 8px; border-radius: 50%; background: #ff3b30; }
      #watch .what { flex: 1; font-size: 12px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      #watch .speed { font: 700 14px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.08em; color: #ffd84a; }
      #watch .cam { font: 700 13px/1 'Barlow Condensed', sans-serif; letter-spacing: 0.1em; color: #6fd0ff; }
      #watch .track { position: relative; height: 18px; margin: 8px 0 4px; cursor: pointer; touch-action: none; }
      #watch .track::before { content: ''; position: absolute; left: 0; right: 0; top: 7px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, 0.25); }
      #watch .fill { position: absolute; left: 0; top: 7px; height: 4px; border-radius: 2px; background: #ffd84a; }
      #watch .knob { position: absolute; top: 3px; width: 12px; height: 12px; margin-left: -6px; border-radius: 50%; background: #fff; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.5); }
      #watch .mark { position: absolute; top: 4px; width: 2px; height: 10px; margin-left: -1px; border-radius: 1px; background: #fff; opacity: 0.85; }
      #watch .mark.exit { background: #6fd0ff; }
      #watch .mark.open { background: #8fe0a6; }
      #watch .mark.landing { background: #ff8a7a; }
      #watch .foot { display: flex; align-items: center; justify-content: space-between; font-size: 12px; opacity: 0.9; }
      #watch .buttons { display: flex; gap: 6px; }
      #watch button {
        font: 600 12px/1 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; color: #fff; cursor: pointer; min-width: 30px;
        padding: 5px 8px; border-radius: 6px; border: 1px solid rgba(255, 255, 255, 0.35); background: rgba(255, 255, 255, 0.08);
      }
      #watch button:hover { background: rgba(255, 255, 255, 0.2); }
      #hud.watching #watch { display: block; }
      #hud.watching .card, #hud.watching #cue, #hud.watching #held { visibility: hidden; }
    </style>
  </head>
  <body>
    <canvas id="view"></canvas>
    <div id="touch"></div>
    <div id="hud">
      <div id="perf" class="corner flight"></div>
      <div id="topRight" class="corner flight"><div id="wind"></div><div id="gear"></div></div>
      <div id="altimeter" class="flight"></div>
      <div id="speeds" class="gauge flight">
        <div class="row"><span class="value" id="varioValue">0</span><span class="unit">m/s</span><div class="label" id="varioLabel">VARIO</div></div>
        <div class="row"><span class="value" id="speedValue">0</span><span class="unit">km/h</span><div class="label" id="speedLabel">VITESSE SOL</div></div>
      </div>
      <div id="held" class="flight">MAINTIEN</div>
      <div id="cue" class="flight"></div>
      <div id="guide" class="flight"></div>
      <div id="keys" class="flight"></div>
      <div id="brakes" class="flight">
        <div class="bar"><div class="front" id="frontL"></div><div class="fill" id="brakeL"></div></div>
        <div class="bar"><div class="front" id="frontR"></div><div class="fill" id="brakeR"></div></div>
      </div>
      <div class="card" id="result"></div>
      <div id="replay"></div>
      <div id="watch"></div>
    </div>
    <div id="menu"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
